<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini App Apèl</title>

<style>
body{
    margin:0;
    padding:0;
    background:#0b141a;
    font-family:Arial;
    color:white;
}

.header{
    background:#202c33;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.container{
    padding:20px;
}

.card{
    background:#202c33;
    border-radius:15px;
    padding:20px;
    text-align:center;
}

img{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #25D366;
}

.name{
    margin-top:15px;
    font-size:24px;
    font-weight:bold;
}

.status{
    color:#25D366;
    margin-top:5px;
}

.buttons{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:20px;
}

button{
    border:none;
    padding:15px 25px;
    border-radius:50px;
    font-size:18px;
    cursor:pointer;
    color:white;
}

.call{
    background:#25D366;
}

.end{
    background:red;
}

.video{
    width:100%;
    margin-top:20px;
    border-radius:15px;
    display:none;
}
</style>
</head>

<body>

<div class="header">
    Mini WhatsApp Call
</div>

<div class="container">

    <div class="card">

        <img src="https://i.imgur.com/6VBx3io.png">

        <div class="name">Souffrant Robens</div>

        <div class="status" id="status">
            Offline
        </div>

        <video id="video" class="video" autoplay muted loop>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>

        <div class="buttons">
            <button class="call" onclick="startCall()">
                📞 Rele
            </button>

            <button class="end" onclick="endCall()">
                ❌ Koupe
            </button>
        </div>

    </div>

</div>

<script>

let status = document.getElementById("status");
let video = document.getElementById("video");

function startCall(){

    status.innerHTML = "Apèl an kou...";
    video.style.display = "block";
    video.play();

    alert("Apèl lan kòmanse!");
}

function endCall(){

    status.innerHTML = "Apèl fini";
    video.pause();
    video.style.display = "none";

    alert("Apèl koupe!");
}

</script>

</body>
</html>
